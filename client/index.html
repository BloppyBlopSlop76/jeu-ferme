<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no : plein écran sur mobile, pas de zoom accidentel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2f4f2f" />
    <title>Jeu Ferme — prototype</title>
    <style>
      /* Le jeu occupe tout l'écran, sans marge ni barre de défilement */
      html, body { margin: 0; padding: 0; height: 100%; background: #2f4f2f; overflow: hidden; }
      #game { width: 100%; height: 100%; touch-action: none; }

      /* Écran « tourne ton téléphone » : caché par défaut… */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #2f4f2f; color: #fff; font-family: sans-serif; text-align: center;
        flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      }
      #rotate .phone {
        width: 36px; height: 64px; border: 3px solid #fff; border-radius: 8px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 20% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      /* …et affiché seulement sur un écran tactile tenu à la verticale (le jeu est en paysage). */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      <p>Tourne ton téléphone<br />pour jouer en mode paysage</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
