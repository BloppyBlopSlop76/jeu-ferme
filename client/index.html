<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no : plein écran sur mobile, pas de zoom accidentel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2f4f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Jeu Ferme — prototype</title>
    <style>
      /* Le jeu occupe tout l'écran, sans marge ni barre de défilement */
      html, body { margin: 0; padding: 0; height: 100%; background: #2f4f2f; overflow: hidden; }
      #game { width: 100%; height: 100%; touch-action: none; }

      /* Écran « tourne ton téléphone » : caché par défaut… */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #2f4f2f; color: #fff; font-family: sans-serif; text-align: center;
        flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px;
      }
      #rotate .phone {
        width: 36px; height: 64px; border: 3px solid #fff; border-radius: 8px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 20% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      #rotate p { margin: 0; line-height: 1.5; }
      #rotate small { opacity: 0.7; }
      #rotate button {
        font: inherit; font-size: 18px; padding: 12px 28px; border: 0; border-radius: 999px;
        background: #f2c14e; color: #2f2a1a; font-weight: bold;
      }
      /* …affiché seulement sur un écran tactile tenu à la verticale (le jeu est en paysage),
         et jamais une fois que le joueur a choisi de continuer. */
      @media (orientation: portrait) and (pointer: coarse) {
        html:not(.rotate-dismissed) #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      <p>Ce jeu se joue en mode paysage.<br /><small>Tourne ton téléphone (rotation automatique activée).</small></p>
      <button id="rotate-play" type="button">Jouer</button>
    </div>
    <script>
      // Bouton « Jouer » : on tente le plein écran puis le verrouillage en paysage
      // (fonctionne sur Android/Chrome ; iPhone ne l'autorise pas), et on laisse jouer quoi qu'il arrive.
      document.getElementById('rotate-play').addEventListener('click', async () => {
        document.documentElement.classList.add('rotate-dismissed');
        try {
          const el = document.documentElement;
          if (el.requestFullscreen) await el.requestFullscreen();
        } catch (e) { /* refusé : tant pis */ }
        try {
          if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
        } catch (e) { /* non supporté (iPhone) ou refusé : tant pis */ }
        // Phaser recalcule la taille du canvas tout seul au redimensionnement.
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
